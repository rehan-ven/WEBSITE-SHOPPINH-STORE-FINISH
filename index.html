    }
    .picture-choice:hover { transform: var(--lift); }
    .picture-choice.circled {
      border-color: var(--primary);
      box-shadow: var(--shadow-pink-deep);
    }
    .picture-choice.correct {
      border-color: var(--positive);
      background: var(--positive-container);
    }
    .picture-choice.wrong {
      border-color: var(--error);
      background: var(--error-container);
    }

    /* Digital Coloring (TK Activity 4) */
    .palette-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
      background: var(--surface-container);
      padding: var(--space-md);
      border-radius: var(--rounded);
      margin-bottom: var(--space-lg);
    }
    .swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: var(--rounded-full);
      border: 3px solid transparent;
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-weight: 800;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-short) var(--ease-out);
    }
    .swatch-btn:hover { transform: var(--pop-scale); }
    .swatch-btn.active {
      border-color: var(--on-surface);
      box-shadow: var(--shadow-pink);
    }
    .swatch-dot {
      width: 22px;
      height: 22px;
      border-radius: var(--rounded-full);
      border: 2px solid var(--on-surface);
    }
    .swatch-red { background: var(--illus-red); }
    .swatch-yellow { background: var(--illus-yellow); }
    .swatch-blue { background: var(--illus-blue); }
    .swatch-pink { background: var(--illus-pink); }
    .swatch-none { background: var(--illus-white); }

    .coloring-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .coloring-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-grape);
      padding: var(--space-lg);
      display: grid;
      justify-items: center;
      gap: var(--space-sm);
      cursor: pointer;
      border: 3px solid transparent;
      text-align: center;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-short) var(--ease-out);
    }
    .coloring-card:hover { transform: var(--lift); }
    .coloring-card.done-ok { border-color: var(--positive); }
    .coloring-card.done-hint { border-color: var(--warning); }

    /* Speaking Practice & Dialogue */
    .dialogue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .speak-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-pink);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
      border: 3px solid transparent;
    }
    .speak-card.practiced { border-color: var(--positive); }
    .bubble {
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      font-weight: 600;
    }
    .bubble-teacher {
      background: var(--secondary-container);
      color: var(--on-surface);
    }
    .bubble-student {
      background: var(--tertiary-container);
      color: var(--on-surface);
    }
    .bubble-active {
      outline: 3px solid var(--primary);
      box-shadow: var(--shadow-pink);
    }

    /* Word Bank & Sentences */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      background: var(--surface-container);
      padding: var(--space-md);
      border-radius: var(--rounded);
      margin-bottom: var(--space-lg);
      align-items: center;
    }
    .word-chip {
      border: 2px solid var(--outline);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 8px 16px;
      min-height: 40px;
      border-radius: var(--rounded-full);
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
    }
    .word-chip:hover:not(:disabled) {
      transform: var(--pop-scale);
      border-color: var(--primary);
    }
    .word-chip.selected {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .word-chip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .store-id-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .store-id-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-sky);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
      justify-items: center;
    }
    .store-id-card .field { width: 100%; }

    .sentence-list {
      display: grid;
      gap: var(--space-md);
    }
    .sentence-row {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-grape);
      padding: var(--space-md) var(--space-lg);
      display: grid;
      gap: var(--space-sm);
    }
    .sentence-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
      font-weight: 700;
      font-size: 1.05rem;
    }
    .blank-input {
      min-width: 170px;
      max-width: 240px;
      display: inline-block;
    }

    /* Reading Comprehension (SD Activity 4) */
    .reading-card {
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      display: grid;
      gap: var(--space-md);
    }
    .reading-text {
      font-size: 1.125rem;
      line-height: 1.75;
      color: var(--on-surface);
      max-width: 65ch;
      margin: 0;
    }
    .mcq-list {
      display: grid;
      gap: var(--space-lg);
    }
    .mcq-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-pink);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
    }
    .mcq-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: var(--space-sm);
    }
    .mcq-btn {
      text-align: left;
      padding: 12px 16px;
      min-height: 44px;
      border-radius: var(--rounded);
      border: 2px solid var(--outline-variant);
      background: var(--surface-container);
      color: var(--on-surface);
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .mcq-btn:hover { transform: var(--pop-scale); border-color: var(--secondary); }
    .mcq-btn.selected {
      background: var(--secondary);
      color: var(--on-secondary);
      border-color: var(--secondary);
    }
    .mcq-btn.correct {
      background: var(--positive-container);
      color: var(--on-surface);
      border-color: var(--positive);
    }
    .mcq-btn.wrong {
      background: var(--error-container);
      color: var(--on-surface);
      border-color: var(--error);
    }

    /* Arrange Words (SD Activity 5) */
    .arrange-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-sky);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
    }
    .arrange-tray {
      min-height: 58px;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      background: var(--surface-container);
      border: 2px dashed var(--outline);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
    }
    .arrange-tray.is-correct {
      border-style: solid;
      border-color: var(--positive);
      background: var(--positive-container);
    }
    .arrange-tray.is-wrong {
      border-style: solid;
      border-color: var(--error);
      background: var(--error-container);
    }
    .tile-pool {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    /* Dialogue Completion (SD Activity 6) */
    .dialogue-stage {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: var(--space-xl);
      align-items: start;
    }
    .dialogue-lines {
      display: grid;
      gap: var(--space-sm);
    }
    .dialogue-line {
      padding: var(--space-md);
      border-radius: var(--rounded);
      background: var(--surface-container);
      display: grid;
      gap: 4px;
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out);
    }
    .dialogue-line.shopkeeper { background: var(--secondary-container); }
    .dialogue-line.customer { background: var(--tertiary-container); }
    .dialogue-line.speaking-now {
      outline: 3px solid var(--primary);
      transform: var(--pop-scale);
      box-shadow: var(--shadow-pink);
    }
    .blank-slot-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 40px;
      padding: 4px 14px;
      border-radius: var(--rounded-full);
      border: 2px dashed var(--primary);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-weight: 800;
      cursor: pointer;
    }
    .blank-slot-btn.filled {
      border-style: solid;
      background: var(--primary-container);
    }

    /* Shopping List (SD Activity 7) */
    .list-builder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .list-cat-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-grape);
      padding: var(--space-md);
      display: grid;
      gap: var(--space-sm);
    }
    .mini-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mini-chip {
      border: 1.5px solid var(--outline);
      background: var(--surface-container);
      color: var(--on-surface);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 12px;
      min-height: 36px;
      border-radius: var(--rounded-full);
      cursor: pointer;
    }
    .mini-chip.active {
      background: var(--secondary);
      color: var(--on-secondary);
      border-color: var(--secondary);
    }

    /* Part C: Mini Shopping Challenge */
    .sim-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--space-lg);
      align-items: start;
    }
    .store-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }
    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr));
      gap: var(--space-md);
    }
    .product-tile {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-sky);
      padding: var(--space-md);
      display: grid;
      justify-items: center;
      gap: 6px;
      border: 3px solid transparent;
      cursor: pointer;
      text-align: center;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-short) var(--ease-out);
    }
    .product-tile:hover { transform: var(--lift); }
    .product-tile.in-basket {
      border-color: var(--primary);
      background: var(--surface-container);
    }
    .chat-log {
      display: grid;
      gap: var(--space-sm);
      max-height: 260px;
      overflow-y: auto;
      padding: var(--space-md);
      background: var(--surface-container);
      border-radius: var(--rounded);
    }
    .prompt-group {
      display: grid;
      gap: var(--space-xs);
    }
    .prompt-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Results Page */
    .results-hero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
      gap: var(--space-md);
      margin: var(--space-lg) 0;
    }
    .metric-tile {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-pink);
      padding: var(--space-lg);
      display: grid;
      gap: 4px;
    }
    .metric-tile:nth-child(2) { box-shadow: var(--shadow-sky); }
    .metric-tile:nth-child(3) { box-shadow: var(--shadow-grape); }
    .metric-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .breakdown-list {
      display: grid;
      gap: var(--space-sm);
    }
    .breakdown-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-sm);
      background: var(--surface-container);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--rounded);
    }

    /* Feedback & Footer Actions */
    .feedback-box {
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--rounded);
      font-weight: 700;
      margin-top: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .feedback-box.ok {
      background: var(--positive-container);
      color: var(--on-surface);
    }
    .feedback-box.warn {
      background: var(--warning-container);
      color: var(--on-surface);
    }
    .feedback-box.err {
      background: var(--error-container);
      color: var(--on-surface);
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      align-items: center;
      margin-top: var(--space-lg);
    }
    .stage-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      padding-top: var(--space-lg);
      border-top: 2px solid var(--outline-variant);
    }

    .hidden { display: none !important; }

    /* Container queries for adaptive split cards */
    .card-wrapper { container-type: inline-size; }
    @container (max-width: 520px) {
      .dialogue-stage { grid-template-columns: 1fr; }
    }

    /* Mobile breakpoint */
    @media (max-width: 640px) {
      .page-grid {
        padding: var(--space-sm);
        gap: var(--space-md);
      }
      .hero-panel { padding: var(--space-lg); }
      .welcome-grid,
      .welcome-form-row,
      .level-choices,
      .match-board,
      .picture-options,
      .dialogue-stage,
      .sim-layout {
        grid-template-columns: 1fr;
      }
      .progress-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-grid">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-group">
          <button type="button" class="brand-pill" onclick="goToView('welcome')">
            <i data-lucide="shopping-bag" aria-hidden="true"></i>
            <span>Let's Go Shopping!</span>
          </button>
          <span id="student-badge" class="student-badge">Little Shopper</span>
        </div>

        <div class="header-controls">
          <div class="level-pill-switch" role="group" aria-label="Learning Level">
            <button type="button" id="switch-tk" class="level-switch-btn" onclick="selectLevel('tk', false)">TK</button>
            <button type="button" id="switch-sd" class="level-switch-btn" onclick="selectLevel('sd', false)">SD</button>
          </div>
          <button type="button" id="sound-toggle-btn" class="btn btn-soft btn-sm" onclick="toggleSound()">
            <i data-lucide="volume-2" aria-hidden="true"></i>
            <span id="sound-toggle-label">Voice: On</span>
          </button>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track-wrap">
          <div class="progress-labels">
            <span id="progress-text">0 / 6 Activities Completed</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar-aria">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="score-pill" id="header-score-pill">
          <i data-lucide="star" aria-hidden="true"></i>
          <span id="header-score-text">Score: 0</span>
        </div>
      </div>

      <nav class="nav-strip" id="nav-strip" aria-label="Worksheet Activities"></nav>
    </header>

    <!-- Main Interactive Stage -->
    <main id="stage-root"></main>
  </div>

  <api-shim></api-shim>
  <script>
    /* ======================================================================
       1. SVG CARTOON ILLUSTRATION LIBRARY (All colors from CSS tokens)
       ====================================================================== */
    function svgWrapper(inner, size) {
      const s = size || 96;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true">${inner}</svg>`;
    }

    function getProductSvg(key, size, customFill) {
      const fillOverride = customFill || '';
      switch (key) {
        case 'bread':
          return svgWrapper(`
            <ellipse cx="60" cy="76" rx="44" ry="22" fill="var(--illus-tan)" stroke="var(--illus-ink)" stroke-width="4"/>
            <path d="M22 72 C22 40, 98 40, 98 72 Z" fill="var(--illus-brown)" stroke="var(--illus-ink)" stroke-width="4"/>
            <path d="M40 52 L48 64 M60 48 L64 62 M80 52 L76 64" stroke="var(--illus-cream)" stroke-width="4" stroke-linecap="round"/>
          `, size);
        case 'teddy':
          return svgWrapper(`
            <circle cx="34" cy="34" r="13" fill="var(--illus-brown)" stroke="var(--illus-ink)" stroke-width="4"/>
            <circle cx="86" cy="34" r="13" fill="var(--illus-brown)" stroke="var(--illus-ink)" stroke-width="4"/>
            <circle cx="34" cy="34" r="6" fill="var(--illus-tan-light)"/>
            <circle cx="86" cy="34" r="6" fill="var(--illus-tan-light)"/>
            <ellipse cx="60" cy="86" rx="28" ry="24" fill="var(--illus-brown)" stroke="var(--illus-ink)" stroke-width="4"/>
            <ellipse cx="60" cy="88" rx="16" ry="15" fill="var(--illus-tan-light)"/>
            <circle cx="60" cy="50" r="26" fill="var(--illus-brown)" stroke="var(--illus-ink)" stroke-width="4"/>
            <ellipse cx="60" cy="58" rx="13" ry="10" fill="var(--illus-tan-light)"/>
            <circle cx="50" cy="44" r="3.5" fill="var(--illus-ink)"/>
            <circle cx="70" cy="44" r="3.5" fill="var(--illus-ink)"/>
            <ellipse cx="60" cy="54" rx="5" ry="3.5" fill="var(--illus-ink)"/>
            <path d="M54 62 Q60 67 66 62" fill="none" stroke="var(--illus-ink)" stroke-width="3" stroke-linecap="round"/>
          `, size);
        case 'book':
          return svgWrapper(`
            <rect x="24" y="24" width="72" height="74" rx="10" fill="var(--illus-blue)" stroke="var(--illus-ink)" stroke-width="4"/>
            <rect x="24" y="24" width="16" height="74" rx="6" fill="var(--illus-purple)" stroke="var(--illus-ink)" stroke-width="4"/>
            <rect x="48" y="38" width="38" height="22" rx="5" fill="var(--illus-yellow-light)" stroke="var(--illus-ink)" stroke-width="3"/>
            <line x1="50" y1="74" x2="84" y2="74" stroke="var(--illus-white)" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="84" x2="76" y2="84" stroke="var(--illus-white)" stroke-width="4" stroke-linecap="round"/>
          `, size);
        case 'apple':
          return svgWrapper(`
            <path d="M60 34 C46 24, 24 34, 26 62 C28 90, 48 98, 60 94 C72 98, 92 90, 94 62 C96 34, 74 24, 60 34 Z" fill="${fillOverride || 'var(--illus-red)'}" stroke="var(--illus-ink)" stroke-width="4"/>
            <path d="M60 34 Q60 18 68 14" fill="none" stroke="var(--illus-brown)" stroke-width="5" stroke-linecap="round"/>
            <path d="M62 24 C74 14, 86 22, 78 32 C72 34, 64 30, 62 24 Z" fill="${fillOverride ? fillOverride : 'var(--illus-green)'}" stroke="var(--illus-ink)" stroke-width="3"/>
            <path d="M40 48 Q36 58 40 66" fill="none" stroke="var(--illus-white)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
          `, size);
        case 'shirt':
          return svgWrapper(`
            <path d="M36 26 L48 26 Q60 36 72 26 L84 26 L104 44 L92 60 L82 52 L82 96 L38 96 L38 52 L28 60 L16 44 Z" fill="${fillOverride || 'var(--illus-blue)'}" stroke="var(--illus-ink)" stroke-width="4" stroke-linejoin="round"/>
            <path d="M48 26 Q60 38 72 26" fill="none" stroke="var(--illus-ink)" stroke-width="3.5"/>
          `, size);
        case 'flower':
          return svgWrapper(`
            <path d="M60 66 L60 104" stroke="${fillOverride ? 'var(--illus-ink)' : 'var(--illus-green)'}" stroke-width="6" stroke-linecap="round"/>
            <path d="M60 88 Q76 76 80 86 Q72 96 60 88 Z" fill="${fillOverride || 'var(--illus-green)'}" stroke="var(--illus-ink)" stroke-width="3"/>
            <circle cx="60" cy="30" r="14" fill="${fillOverride || 'var(--illus-pink)'}" stroke="var(--illus-ink)" stroke-width="3.5"/>
            <circle cx="80" cy="45" r="14" fill="${fillOverride || 'var(--illus-pink)'}" stroke="var(--illus-ink)" stroke-width="3.5"/>
            <circle cx="72" cy="68" r="14" fill="${fillOverride || 'var(--illus-pink)'}" stroke="var(--illus-ink)" stroke-width="3.5"/>

    function speakText(text) {
      if (!appState.soundOn) return;
      try {
        if (`speechSynthesis` in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = `en-US`;
          utter.rate = 0.9;
          utter.pitch = 1.08;
          window.speechSynthesis.speak(utter);
        }
      } catch (err) {
        /* speech synthesis not supported */
      }
    }

    function playChime(isGood) {
      if (!appState.soundOn) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = `sine`;
        const now = ctx.currentTime;
        if (isGood) {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
        } else {
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(260, now + 0.1);
        }
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (err) {
        /* audio context blocked */
      }
    }

        const a5Done = appState.tkSpeakDone.length >= TK_SPEAKING.length;

        const completedCount = activities.filter(a => a.done).length;

        const totalMax = activities.reduce((acc, a) => acc + a.max, 0);
        return { activities, completedCount, totalActivities: activities.length, totalCorrect, totalMax };
      }

      // Elementary School (SD)
      let b1Correct = 0;
      SD_ACT1_STORES.forEach(s => {
        if ((appState.sdAct1Inputs[s.id] || ``).trim().toLowerCase() === s.answer.toLowerCase()) b1Correct += 1;

      });
      const b2Done = appState.sdMatchChecked;

      let b3Correct = 0;

      let b5Correct = 0;
      SD_ARRANGE.forEach(a => {

      const badge = document.getElementById(`student-badge`);
      if (badge) {
        const namePart = appState.studentName.trim() ? appState.studentName.trim() : `Little Shopper`;
        const classPart = appState.studentClass.trim() ? ` · Class ${appState.studentClass.trim()}` : ``;
        const levelPart = appState.level === `tk` ? `TK` : `SD`;
        badge.textContent = `${namePart}${classPart} (${levelPart})`;
      }

      const swTk = document.getElementById(`switch-tk`);
      const swSd = document.getElementById(`switch-sd`);
      if (swTk) swTk.classList.toggle(`active`, appState.level === `tk`);
      if (swSd) swSd.classList.toggle(`active`, appState.level === `sd`);

      const sndLabel = document.getElementById(`sound-toggle-label`);
      if (sndLabel) sndLabel.textContent = appState.soundOn ? `Voice: On` : `Voice: Off`;

      const progText = document.getElementById(`progress-text`);
      const progPct = document.getElementById(`progress-pct`);
      const progFill = document.getElementById(`progress-fill`);
      const progAria = document.getElementById(`progress-bar-aria`);
      if (progText) progText.textContent = `${metrics.completedCount} / ${metrics.totalActivities} Activities Completed`;
      if (progPct) progPct.textContent = `${pct}%`;
      if (progFill) progFill.style.width = `${pct}%`;
      if (progAria) progAria.setAttribute(`aria-valuenow`, String(pct));

      const scoreText = document.getElementById(`header-score-text`);
      if (scoreText) scoreText.textContent = `Score: ${metrics.totalCorrect}/${metrics.totalMax} (${scorePct}%)`;

      const navStrip = document.getElementById(`nav-strip`);
      if (navStrip) {
        const navItems = getNavItems();
        const doneMap = {};
        metrics.activities.forEach(a => { doneMap[a.id] = a.done; });
        navStrip.innerHTML = navItems.map(item => {
          const isActive = appState.view === item.id;
          const isDone = !!doneMap[item.id];
          return `
            <button type="button" class="nav-pill ${isActive ? `active` : ``} ${isDone ? `done` : ``}" onclick="goToView('${item.id}')">
              <span class="nav-dot">${isDone ? `✓` : item.short}</span>
              <span>${item.label}</span>
            </button>
          `;
        }).join(``);
      }
    }

    function renderStageFooter() {
      const navItems = getNavItems();
      const idx = navItems.findIndex(n => n.id === appState.view);
      const prev = idx > 0 ? navItems[idx - 1] : null;
      const next = idx >= 0 && idx < navItems.length - 1 ? navItems[idx + 1] : null;
      return `
        <div class="stage-footer">
          <div>
            ${prev ? `<button type="button" class="btn btn-soft" onclick="goToView('${prev.id}')"><i data-lucide="arrow-left" aria-hidden="true"></i><span>Back: ${prev.label}</span></button>` : ``}

            ${next ? `<button type="button" class="btn btn-primary" onclick="goToView('${next.id}')"><span>Next: ${next.label}</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>` : ``}

        </div>
      `;
    }

    /* ======================================================================
       7. HOISTED EVENT HANDLERS
       ====================================================================== */
    function escapeHtml(str) {
      return String(str || ``)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`)
        .replace(/'/g, `&#39;`);
    }

    function getStoreLabel(id) {
      const all = TK_MATCH_STORES.concat(SD_MATCH_STORES);
      const found = all.find(s => s.id === id);
      return found ? found.label : id;
    }

    function goToView(viewId) {
      appState.view = viewId;
      selectedMatchSource = null;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    function updateStudentInfo(field, value) {
      appState[field] = value;
      persistState();
      renderShell();
    }

    function selectLevel(level, jumpToFirst) {
      appState.level = level;
      appState.reviewMode = false;
      if (jumpToFirst) {
        appState.view = level === `tk` ? `tk1` : `sd1`;
      } else if (appState.view !== `welcome` && appState.view !== `partc` && appState.view !== `results`) {
        appState.view = level === `tk` ? `tk1` : `sd1`;
      }
      persistState();
      renderApp();
    }

    function toggleSound() {
      appState.soundOn = !appState.soundOn;
      persistState();
      renderShell();
    }

    /* TK Activity 1 */
    function sayVocabWord(id) {
      const item = TK_VOCAB.find(v => v.id === id);
      if (!item) return;
      if (!appState.tkVocabClicked.includes(id)) {
        appState.tkVocabClicked.push(id);
      }
      speakText(item.word);
      playChime(true);
      persistState();
      renderApp();
    }

    /* Matching (TK2 & SD2) */
    function onDragProduct(ev, prodId) {
      draggedProductId = prodId;
      if (ev && ev.dataTransfer) {
        ev.dataTransfer.setData(`text/plain`, prodId);
      }
    }

    function onDropStore(ev, track, storeId) {
      ev.preventDefault();
      const prodId = (ev.dataTransfer && ev.dataTransfer.getData(`text/plain`)) || draggedProductId;
      if (!prodId) return;
      assignMatchPair(track, prodId, storeId);
      draggedProductId = null;
    }

    function tapMatchProduct(track, prodId) {
      selectedMatchSource = selectedMatchSource === prodId ? null : prodId;
      renderApp();
    }

    function tapMatchStore(track, storeId) {
      if (!selectedMatchSource) return;
      assignMatchPair(track, selectedMatchSource, storeId);
      selectedMatchSource = null;
    }

    function assignMatchPair(track, prodId, storeId) {
      const pairs = track === `tk` ? appState.tkMatchPairs : appState.sdMatchPairs;
      Object.keys(pairs).forEach(k => {
        if (pairs[k] === storeId) delete pairs[k];
      });
      pairs[prodId] = storeId;
      if (track === `tk`) appState.tkMatchChecked = false;
      else appState.sdMatchChecked = false;
      playChime(true);
      persistState();
      renderApp();
    }

    function checkTkMatch() {
      appState.tkMatchChecked = true;
      let ok = 0;
      TK_MATCH_PRODUCTS.forEach(p => { if (appState.tkMatchPairs[p.id] === p.correctStore) ok += 1; });
      playChime(ok === 4);
      persistState();
      renderApp();
    }

    function showTkMatchAnswers() {
      TK_MATCH_PRODUCTS.forEach(p => { appState.tkMatchPairs[p.id] = p.correctStore; });
      appState.tkMatchChecked = true;
      persistState();
      renderApp();
    }

    function resetTkMatch() {
      appState.tkMatchPairs = {};
      appState.tkMatchChecked = false;
      selectedMatchSource = null;
      persistState();
      renderApp();
    }

    /* TK Activity 3 */
    function pickTkQuiz(qId, optId) {
      appState.tkQuizAnswers[qId] = optId;
      appState.tkQuizChecked = true;
      const q = TK_QUIZ.find(item => item.id === qId);
      playChime(q && q.answer === optId);
      persistState();
      renderApp();
    }

    function submitTkQuiz() {
      appState.tkQuizChecked = true;
      persistState();
      renderApp();
    }

    /* TK Activity 4 */
    function selectBrush(colorId) {
      appState.tkColorBrush = colorId;
      persistState();
      renderApp();
    }

    function colorItem(itemId) {
      if (appState.tkColorBrush === `none`) {
        delete appState.tkColored[itemId];
      } else {
        appState.tkColored[itemId] = appState.tkColorBrush;
        const item = TK_COLOR_ITEMS.find(c => c.id === itemId);
        playChime(item && item.targetColor === appState.tkColorBrush);
      }
      persistState();
      renderApp();
    }

    /* TK Activity 5 */
    function listenSpeakPair(id) {
      const pair = TK_SPEAKING.find(s => s.id === id);
      if (!pair) return;
      speakText(`${pair.teacher} ... ${pair.student}`);
      if (!appState.tkSpeakDone.includes(id)) {
        appState.tkSpeakDone.push(id);
        persistState();
        renderApp();
      }
    }

    function toggleSpeakDone(id) {
      if (appState.tkSpeakDone.includes(id)) {
        appState.tkSpeakDone = appState.tkSpeakDone.filter(x => x !== id);
      } else {
        appState.tkSpeakDone.push(id);
        playChime(true);
      }
      persistState();
      renderApp();
    }

    /* SD Activity 1 */
    function updateSd1Input(id, val) {
      appState.sdAct1Inputs[id] = val;
      appState.sdAct1Checked = false;
      persistState();
    }

    function fillSd1Word(word) {
      const target = appState.sdAct1ActiveBlank || `bakery`;
      appState.sdAct1Inputs[target] = word;
      const nextIdx = SD_ACT1_STORES.findIndex(s => s.id === target) + 1;
      if (nextIdx < SD_ACT1_STORES.length) {
        appState.sdAct1ActiveBlank = SD_ACT1_STORES[nextIdx].id;
      }
      appState.sdAct1Checked = false;
      persistState();
      renderApp();
    }

    function checkSd1() {
      appState.sdAct1Checked = true;
      let score = 0;
      SD_ACT1_STORES.forEach(s => {
        if ((appState.sdAct1Inputs[s.id] || ``).trim().toLowerCase() === s.answer.toLowerCase()) score += 1;
      });
      playChime(score === 6);
      persistState();
      renderApp();
    }

    /* SD Activity 2 */
    function checkSdMatch() {
      appState.sdMatchChecked = true;
      let score = 0;
      SD_MATCH_PRODUCTS.forEach(p => { if (appState.sdMatchPairs[p.id] === p.correctStore) score += 1; });
      playChime(score === 6);
      persistState();
      renderApp();
    }

    function resetSdMatch() {
      appState.sdMatchPairs = {};
      appState.sdMatchChecked = false;
      selectedMatchSource = null;
      persistState();
      renderApp();
    }

    /* SD Activity 3 */
    function updateSd3Input(id, val) {
      appState.sdSentInputs[id] = val;
      appState.sdSentChecked = false;
      persistState();
    }

    function fillSd3Word(word) {
      const target = appState.sdSentActiveBlank || `st1`;
      appState.sdSentInputs[target] = word;
      const nextIdx = SD_SENTENCES.findIndex(s => s.id === target) + 1;
      if (nextIdx < SD_SENTENCES.length) {
        appState.sdSentActiveBlank = SD_SENTENCES[nextIdx].id;
      }
      appState.sdSentChecked = false;
      persistState();
      renderApp();
    }

    function checkSd3() {
      appState.sdSentChecked = true;
      let score = 0;
      SD_SENTENCES.forEach(s => {
        if ((appState.sdSentInputs[s.id] || ``).trim().toLowerCase() === s.answer.toLowerCase()) score += 1;
      });
      playChime(score === 6);
      persistState();
      renderApp();
    }

    /* SD Activity 4 */
    function readPassageAloud() {
      speakText(SD_READING_PASSAGE);
    }

    function pickSdRead(qId, optIdx) {
      appState.sdReadAnswers[qId] = optIdx;
      appState.sdReadChecked = false;
      persistState();
      renderApp();
    }

    function checkSd4() {
      appState.sdReadChecked = true;
      let score = 0;
      SD_READING_QUESTIONS.forEach(q => { if (appState.sdReadAnswers[q.id] === q.answer) score += 1; });
      playChime(score === 5);
      persistState();
      renderApp();
    }

    /* SD Activity 5 */
    function addArrangeTile(qId, tileIdx) {
      const arr = appState.sdArrangePicked[qId] || [];
      if (!arr.includes(tileIdx)) arr.push(tileIdx);
      appState.sdArrangePicked[qId] = arr;
      appState.sdArrangeChecked = false;
      persistState();
      renderApp();
    }

    function removeArrangeTile(qId, pos) {
      const arr = appState.sdArrangePicked[qId] || [];
      arr.splice(pos, 1);
      appState.sdArrangePicked[qId] = arr;
      appState.sdArrangeChecked = false;
      persistState();
      renderApp();
    }

    function clearArrange(qId) {
      appState.sdArrangePicked[qId] = [];
      appState.sdArrangeChecked = false;
      persistState();
      renderApp();
    }

    function checkSd5() {
      appState.sdArrangeChecked = true;
      let score = 0;
      SD_ARRANGE.forEach(a => {
        const picked = (appState.sdArrangePicked[a.id] || []).map(idx => a.tiles[idx]).join(` `);
        if (picked === a.answer) score += 1;
      });
      playChime(score === 5);
      persistState();
      renderApp();
    }

    /* SD Activity 6 */
    function fillSd6Blank(expr) {
      const slot = appState.sdDialogueActiveSlot || `b1`;
      appState.sdDialogueBlanks[slot] = expr;
      appState.sdDialogueActiveSlot = slot === `b1` ? `b2` : `b1`;
      appState.sdDialogueChecked = false;
      persistState();
      renderApp();
    }

    function checkSd6() {
      appState.sdDialogueChecked = true;
      const ok = appState.sdDialogueBlanks.b1 === `Good morning!` && appState.sdDialogueBlanks.b2 === `Thank you.`;
      playChime(ok);
      persistState();
      renderApp();
    }

    function practiceDialogueAloud() {
      clearInterval(activeSpeechTimer);
      const lines = [
        `Good morning! Can I help you?`,
        appState.sdDialogueBlanks.b1 || `Good morning!`,
        `What do you want?`,
        `I want two donuts, please.`,
        `Here you are.`,
        appState.sdDialogueBlanks.b2 || `Thank you.`,
        `You're welcome!`
      ];
      let step = 0;
      activeDialogueLine = 0;
      speakText(lines[0]);
      renderApp();
      activeSpeechTimer = setInterval(() => {
        step += 1;
        if (step >= lines.length) {
          clearInterval(activeSpeechTimer);
          activeDialogueLine = -1;
          renderApp();
          return;
        }
        activeDialogueLine = step;
        speakText(lines[step]);
        renderApp();
      }, 1700);
    }

    /* SD Activity 7 */
    function pickListCat(catId, item) {
      appState.sdListCats[catId] = item;
      appState.sdListSaved = false;
      persistState();
      renderApp();
    }

    function updateListCat(catId, val) {
      appState.sdListCats[catId] = val;
      appState.sdListSaved = false;
      persistState();
    }

    function updateListSent(key, val) {
      appState.sdListSentences[key] = val;
      appState.sdListSaved = false;
      persistState();
    }

    function saveSd7List() {
      const catsOk = Object.values(appState.sdListCats).every(v => v.trim().length > 0);
      const sentsOk = Object.values(appState.sdListSentences).every(v => v.trim().length > 0);
      const msgEl = document.getElementById(`sd7-msg`);
      if (!catsOk || !sentsOk) {
        if (msgEl) {
          msgEl.innerHTML = `<div class="feedback-box warn"><span>Please choose or type one item for all 4 stores and complete all 3 sentences before saving!</span></div>`;
        }
        playChime(false);
        return;
      }
      appState.sdListSaved = true;
      playChime(true);
      persistState();
      renderApp();
    }

    /* Part C */
    function setPartCStore(storeId) {
      appState.partCStore = storeId;
      persistState();
      renderApp();
    }

    function setPartCRole(role) {
      appState.partCRole = role;
      persistState();
      renderApp();
    }

    function togglePartCProduct(label) {
      if (appState.partCSelectedProducts.includes(label)) {
        appState.partCSelectedProducts = appState.partCSelectedProducts.filter(x => x !== label);
      } else {
        appState.partCSelectedProducts.push(label);
        playChime(true);
      }
      persistState();
      renderApp();
    }

    function sendPartCLine(who, text) {
      appState.partCChat.push({ who, text });
      if (appState.partCChat.length >= 2) {
        appState.partCDone = true;
      }
      speakText(text);
      persistState();
      renderApp();
      const log = document.getElementById(`partc-chat-log`);
      if (log) log.scrollTop = log.scrollHeight;
    }

    function completePartC() {
      appState.partCDone = true;
      playChime(true);
      persistState();
      renderApp();
    }

    function clearPartCChat() {
      appState.partCChat = [];
      persistState();
      renderApp();
    }

    /* Results Actions */
    function reviewMyAnswers() {
      appState.reviewMode = true;
      appState.view = appState.level === `tk` ? `tk2` : `sd1`;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    function startAgain(btn) {
      if (btn && btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        const span = btn.querySelector(`span`);
        if (span) span.textContent = `Tap again to confirm reset`;
        return;
      }
      appState = createInitialState();
      selectedMatchSource = null;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    /* ======================================================================
       8. INITIALIZATION
       ====================================================================== */
    async function initApp() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            appState = Object.assign(createInitialState(), saved);
          }
        }
      } catch (err) {
        /* fallback to fresh state */
      }

      renderApp();

      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
          window.notebookAppApi.notifyAppReady();
        }
      } catch (err) {
        /* ignore outside host */
      }
    }

    initApp();
  </script>
</body>
